
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#263f32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="蜻蜓記帳">

  <title>蜻蜓牌記帳本</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-icon">蜻</div>
      <div>
        <p class="eyebrow">PERSONAL LEDGER</p>
        <h1>蜻蜓牌記帳本</h1>
      </div>
    </header>

    <section class="month-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MONTHLY OVERVIEW</p>
          <h2>本月收支總覽</h2>
        </div>
        <input id="monthPicker" type="month" aria-label="選擇月份">
      </div>

      <div class="summary-grid">
        <article class="summary-card">
          <span>收入</span>
          <strong id="monthIncome">$0</strong>
        </article>
        <article class="summary-card">
          <span>支出</span>
          <strong id="monthExpense">$0</strong>
        </article>
        <article class="summary-card">
          <span>結餘</span>
          <strong id="monthBalance">$0</strong>
        </article>
      </div>

      <div class="ring-card">
        <div id="monthRing" class="ring">
          <div class="ring-center">
            <span>本月結餘</span>
            <strong id="monthNet">$0</strong>
          </div>
        </div>

        <div class="ring-legend">
          <p>
            <i class="dot income-dot"></i>
            收入
            <strong id="incomePercent">0%</strong>
          </p>
          <p>
            <i class="dot expense-dot"></i>
            支出
            <strong id="expensePercent">0%</strong>
          </p>
        </div>
      </div>
    </section>

    <section class="records-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">TRANSACTIONS</p>
          <h2>記帳明細</h2>
        </div>
        <input id="datePicker" type="date" aria-label="選擇日期">
      </div>

      <div class="daily-summary">
        <div>
          <span>當日收入</span>
          <strong id="dayIncome">$0</strong>
        </div>
        <div>
          <span>當日支出</span>
          <strong id="dayExpense">$0</strong>
        </div>
        <div>
          <span>當日結餘</span>
          <strong id="dayBalance">$0</strong>
        </div>
      </div>

      <div class="list-heading">
        <strong id="listDate">交易紀錄</strong>
        <span id="recordCount">0 筆紀錄</span>
      </div>

      <div id="transactionList" class="transaction-list"></div>
    </section>

    <button id="addBtn" class="add-button" type="button">
      ＋ 新增記帳
    </button>
  </main>

  <dialog id="transactionDialog">
    <form id="transactionForm">
      <div class="dialog-heading">
        <h2 id="formTitle">新增紀錄</h2>
        <button
          id="closeDialog"
          class="close-button"
          type="button"
          aria-label="關閉"
        >×</button>
      </div>

      <div class="type-switch">
        <button
          type="button"
          data-type="expense"
          class="type-button active"
          aria-pressed="true"
        >支出</button>

        <button
          type="button"
          data-type="income"
          class="type-button"
          aria-pressed="false"
        >收入</button>
      </div>

      <label class="field-label" for="amount">金額</label>
      <div class="amount-field">
        <span>$</span>
        <input
          id="amount"
          type="number"
          inputmode="decimal"
          min="0.01"
          step="0.01"
          placeholder="0"
          required
        >
      </div>

      <label class="field-label" for="category">分類</label>
      <select id="category" required></select>

      <label class="field-label" for="transactionDate">日期</label>
      <input id="transactionDate" type="date" required>

      <label class="field-label" for="payment">付款方式</label>
      <select id="payment" required>
        <option value="現金">現金</option>
        <option value="金融卡">金融卡</option>
        <option value="信用卡">信用卡</option>
        <option value="銀行轉帳">銀行轉帳</option>
        <option value="LINE Pay">LINE Pay</option>
        <option value="街口支付">街口支付</option>
        <option value="Apple Pay">Apple Pay</option>
        <option value="Google Pay">Google Pay</option>
        <option value="悠遊卡">悠遊卡</option>
        <option value="一卡通">一卡通</option>
        <option value="其他">其他</option>
      </select>

      <label class="field-label" for="note">備註（選填）</label>
      <input
        id="note"
        type="text"
        maxlength="100"
        placeholder="例如：午餐"
      >

      <p id="formError" class="form-error" role="alert"></p>

      <button class="save-button" type="submit">儲存紀錄</button>
      <button id="cancelDialog" class="cancel-button" type="button">取消</button>
    </form>
  </dialog>

  <script src="./app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch((error) => {
            console.error("離線功能註冊失敗：", error);
          });
      });
    }
  </script>
</body>
</html>
